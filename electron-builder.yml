# Packaging for the public build.
#
# Kept out of package.json deliberately: the packaging story has more moving parts than
# the scripts block can hold legibly, and the two are changed for different reasons.
#
# What ships is dist/ and nothing else. `build:app` already produces a self-contained
# tree - the bundled main process, the renderer, and the reference data copied from
# data/ - so the whitelist is short, and anything not named here cannot leak into a
# public download by accident. That matters more than usual: the repo root holds .env,
# an 11k-run stats corpus and the full source.

appId: com.apogee.desktop
productName: Apogee
copyright: Copyright © 2026 Rylee

directories:
  output: release
  buildResources: build

afterPack: tools/afterPack.cjs

# Pin the static runtime supported by this electron-builder version instead of
# its legacy FUSE2 default, which requires libfuse.so.2 on the player's machine.
toolsets:
  appimage: "1.0.3"

files:
  - dist/**
  # Source maps are a third of the package and the source is public on GitHub anyway.
  - "!dist/**/*.map"
  # A dev artifact: `npm run ui` writes the local player's own snapshot here, and
  # build:app copies data/ wholesale, so without this line every download carries
  # somebody's real play history.
  - "!dist/data/snapshot.json"
  # esbuild bundles every runtime dependency into main.cjs, so electron-builder's
  # default of shipping production node_modules as well is 500 files of dead weight
  # and a second, divergent copy of supabase-js. The smoke test on the packaged
  # binary is what proves nothing actually resolves from here at runtime.
  - "!node_modules/**"

# The season editor and the ladder calibrator write back into dist/data (see
# sourceDataDir()). Inside an asar that is read-only, so those writes have to land on
# a real file on disk. Unpacking the data directory is what makes them possible at all.
asarUnpack:
  - dist/data/**

# Challenge links (apogee://duel/..., apogee://daily). This block registers the scheme in
# the macOS Info.plist and the Linux desktop file; on Windows the app registers itself at
# first launch with app.setAsDefaultProtocolClient (src/app/social.ts), because NSIS does
# not write the handler. What a link may do is in src/core/social/deepLinks.ts.
protocols:
  - name: Apogee challenge link
    schemes:
      - apogee

win:
  target: nsis
  icon: build/icon.png

linux:
  syncDesktopName: true
  executableName: apogee
  icon: build/icon.png
  category: Game
  synopsis: KovaaK's training and ranked companion
  artifactName: ${productName}-${version}-linux-${arch}.${ext}
  target:
    - AppImage
  desktop:
    entry:
      StartupWMClass: apogee
      Keywords: KovaaKs;Aim;Training;

nsis:
  # A one-click installer picks the location, installs, and launches, which is the wrong
  # shape for a tool that reads another game's files: people want to see where it went.
  oneClick: false
  allowToChangeInstallationDirectory: true
  # Per-user, so installing needs no administrator prompt - and, less obviously, so the
  # unpacked data directory above lands somewhere the app may actually write to.
  perMachine: false
  createDesktopShortcut: true
  shortcutName: Apogee
  artifactName: ${productName}-${version}-setup.${ext}

# Where installed copies look for updates (src/app/updater.ts). Written into the package
# as app-update.yml; electron-updater reads latest.yml from the newest release. Building
# never publishes: `npm run dist` passes --publish never, and a release goes up only by
# hand, after validate:release and validatePackage, because publishing it is what ships
# the update to everyone.
publish:
  provider: github
  owner: swarlesgnb
  repo: Apogee-1v1s
  releaseType: release
