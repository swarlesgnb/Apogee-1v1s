# Supabase local development config.
# `supabase start` runs the whole stack in Docker; `supabase db reset` applies
# migrations/ then seed.sql.

project_id = "arena"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
# Generous, because a first-run backfill pages through ~11k runs.
max_rows = 2000

[db]
port = 54322
major_version = 17

[studio]
enabled = true
port = 54323

[auth]
enabled = true
# Steam sign-in returns to a loopback port chosen at runtime, so the whole
# 127.0.0.1 range must be allowed as a redirect target.
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["http://127.0.0.1:*", "http://localhost:*"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
# Players never see or type an email; identity comes from Steam. Signup via email
# stays on only because the Steam bridge creates users through the Admin API.
enable_signup = true

[auth.email]
enable_signup = false
enable_confirmations = false

[functions.steam-auth]
# The Steam OpenID callback arrives from Steam's servers, not from a signed-in
# client, so this function must be reachable without a JWT.
verify_jwt = false
